name: dify_sf_app
description: Collaborative workflow editor client for dify-sf (step 1).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collab_client:
    path: ../packages/collab_client
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  web: ^1.1.1
  flutter_scene: ^0.24.3
  vector_math: ^2.4.3
  flutter_svg: ^2.3.0

dev_dependencies:
  yaml: ^3.1.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  meta: ^1.19.0

flutter:
  # Dify's font stack resolves to Noto Sans on Linux (Regular and Bold installed: weight 500 renders Regular, 600
  # Bold); the same two files are bundled for Linux and the web build (macOS, iOS and Windows use system fonts).
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    # Monaco's Linux font stack ('Droid Sans Mono', monospace) resolves to DejaVu Sans Mono; bundled for the code
    # editor on Linux and the web build (assets/fonts/LICENSE-DejaVu.txt).
    - family: DejaVu Sans Mono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
  assets:
    - assets/i18n/languages.json
    - assets/i18n/ar-TN/
    - assets/i18n/de-DE/
    - assets/i18n/en-US/
    - assets/i18n/es-ES/
    - assets/i18n/fa-IR/
    - assets/i18n/fr-FR/
    - assets/i18n/hi-IN/
    - assets/i18n/id-ID/
    - assets/i18n/it-IT/
    - assets/i18n/ja-JP/
    - assets/i18n/ko-KR/
    - assets/i18n/lo-LA/
    - assets/i18n/nl-NL/
    - assets/i18n/pl-PL/
    - assets/i18n/pt-BR/
    - assets/i18n/ro-RO/
    - assets/i18n/ru-RU/
    - assets/i18n/sl-SI/
    - assets/i18n/th-TH/
    - assets/i18n/tr-TR/
    - assets/i18n/uk-UA/
    - assets/i18n/vi-VN/
    - assets/i18n/zh-Hans/
    - assets/i18n/zh-Hant/
    - assets/fonts/OFL.txt
    - assets/fonts/LICENSE-DejaVu.txt
    # Remix Icon as Dify uses it (tool/gen_remix_icons.py, Apache-2.0).
    - assets/remix_icons/
    # Dify's icons (tool/gen_dify_icons.py), one entry per directory.
    - assets/dify_icons/public/agent/
