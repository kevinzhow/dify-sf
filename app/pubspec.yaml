name: dify_sf_app
description: Collaborative workflow editor client for dify-sf (step 1).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collab_client:
    path: ../packages/collab_client
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  web: ^1.1.1
  flutter_scene: ^0.24.3
  vector_math: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  meta: ^1.19.0

flutter:
  assets:
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  uses-material-design: true
