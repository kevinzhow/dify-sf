include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - require_trailing_commas
    - unawaited_futures
    - avoid_dynamic_calls

formatter:
  page_width: 120
  trailing_commas: preserve
