  title: 'Canvas: syncing-data overlay while the draft is re-fetched'
  dify: [web/app/components/workflow/syncing-data-modal.tsx]
  status: not_applicable
  reason: dify-sf never re-fetches a draft over the canvas; the document is live (edits are collaboration ops).
  evidence: ['spec:web/app/components/workflow/__tests__/syncing-data-modal.spec.tsx']
  ours: []
- id: canvas.draft-sync
  area: canvas
  title: 'Canvas: draft auto-save (sync the whole graph to the console API)'
