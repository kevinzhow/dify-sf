features:

# ---------------------------------------------------------------- canvas
- id: canvas.render
  area: canvas
  title: 'Canvas: workflow graph on a pannable, zoomable canvas (zoom 25%-200%)'
  dify: [web/app/components/workflow/index.tsx]
  status: ported
  deviation: Web uses Flutter's retained widget canvas with culling and repaint boundaries, compiled to Dart Wasm/skwasm; geometry and numbers follow React Flow 11. Native GPU builds use Flutter Scene. Scene is an explicit Web diagnostic option (canvas=scene), as detached card captures can produce blank compositor frames during hover.
  evidence: ['spec:web/app/components/workflow', visual:canvas-basic-llm, visual:canvas-if-else, app/test/dify_spec/workflow/base]
  ours: [app/lib/src/canvas/workflow_canvas.dart, app/lib/src/canvas/scene_renderer.dart, app/lib/src/canvas/canvas_controller.dart, tool/build_web.sh, third_party/flutter_scene/PATCHES.md]
- id: canvas.background
  area: canvas
  title: 'Canvas: dotted background'
  dify: [web/app/components/workflow/index.tsx]
  status: ported
  evidence: [visual:canvas-basic-llm]
  ours: [app/lib/src/canvas/canvas_background.dart]
- id: canvas.initial-viewport
  area: canvas
  title: 'Canvas: open at the saved viewport, else fit view'
  dify: [web/app/components/workflow/index.tsx, web/app/components/workflow/utils/workflow-init.ts]
  status: partial
  reason: The canvas always fits the graph when a document opens; the viewport is per-user view state and is not stored in the shared document (Dify saves it with the draft). A start viewport can be passed with ?view= / --view.
  evidence: ['spec:web/app/components/workflow/utils', visual:editor-basic-llm]
  ours: [app/lib/src/canvas/workflow_canvas.dart, app/lib/src/launch_options.dart]
- id: canvas.pointer-mode
  area: canvas
  title: 'Canvas: pointer mode (wheel pans, Ctrl/Cmd+wheel and pinch zoom, middle button pans)'
