  status: ported
  deviation: A drag is a moveNode op; concurrent moves of the same node are last-writer-wins (dify-sf's conflict policy for layout).
  evidence: ['spec:web/app/components/workflow/hooks/__tests__/use-nodes-interactions-without-sync.spec.ts']
  ours: [app/lib/src/canvas/canvas_input.dart, app/lib/src/workflow_editor/workflow_editor.dart]
- id: canvas.help-lines
