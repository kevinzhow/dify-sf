# Feature parity of dify-sf's Flutter port with Dify 1.17.1 (the source of truth for docs/features.md).
#
# One entry per user-visible feature or distinct behaviour. Fields:
#   id        unique, `<area>.<slug>`
#   area      one of the areas below
#   title     English, what a Dify user would call it
#   dify      paths (relative to the Dify source root) of the components / hooks implementing it in Dify
#   status    ported | partial | not_ported | not_applicable | dify_sf_only
#   reason    required unless ported: what is missing / why it is not ported / why it does not apply
#   deviation optional: ported, but intentionally different from Dify, and why
#   evidence  spec:<Dify spec dir or spec file> (from tool/dify_spec/cases.txt, the ledger's case list; the Dart port
#             lives under app/test/dify_spec/), visual:<case id> (tool/visual/cases.json), or a path in this repo
#   ours      main Dart paths in this repo
#
# Regenerate docs/features.md and the README blocks: python3 tool/features/gen.py
# Check (CI / before merging):                      python3 tool/features/gen.py --check
# Every Dify spec directory the ledger knows must be named by some feature's evidence.

