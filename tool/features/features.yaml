  status: not_applicable
  reason: dify-sf has no draft sync; every edit is a journaled collaboration op confirmed by the server (see Collaboration).
  evidence: ['spec:web/app/components/workflow/hooks/__tests__/use-nodes-sync-draft.spec.ts', 'spec:web/app/components/workflow/hooks/__tests__/use-serial-async-callback.spec.ts', 'spec:web/app/components/workflow/store/__tests__/workflow-draft-slice.spec.ts']
