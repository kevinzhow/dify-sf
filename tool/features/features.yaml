  status: ported
  evidence: [app/test/workflow_editor_test.dart, app/test/workflow_editor/canvas_touch_test.dart]
  ours: [app/lib/src/canvas/canvas_input.dart, app/lib/src/canvas/canvas_touch_region.dart]
- id: canvas.hand-mode
  area: canvas
  title: 'Canvas: hand mode (drag pans, wheel zooms)'
  dify: [web/app/components/workflow/index.tsx, web/app/components/workflow/operator/control.tsx]
  status: ported
  evidence: ['spec:web/app/components/workflow/operator']
  ours: [app/lib/src/canvas/canvas_input.dart, app/lib/src/workflow_editor/operator/control.dart]
- id: canvas.double-click-zoom
  area: canvas
  title: 'Canvas: double-click zooms in'
  dify: [web/app/components/workflow/index.tsx]
  status: ported
  evidence: [app/test/workflow_editor/double_click_zoom_test.dart]
  ours: [app/lib/src/canvas/canvas_input.dart]
- id: canvas.select-node
  area: canvas
  title: 'Canvas: click selects one node (no modifier multi-select) and highlights its edges'
  dify: [web/app/components/workflow/hooks/use-nodes-interactions.ts]
  status: ported
  evidence: ['spec:web/app/components/workflow/hooks/__tests__/use-nodes-interactions.spec.ts']
  ours: [app/lib/src/canvas/canvas_selection.dart, app/lib/src/canvas/canvas_input.dart]
- id: canvas.box-select
  area: canvas
  title: 'Canvas: box selection (partial overlap) and dragging the selection'
  dify: [web/app/components/workflow/hooks/use-selection-interactions.ts, web/app/components/workflow/style.css]
  status: ported
  deviation: The selection lives in CanvasSelection; React Flow's _isBundled flags are not stored on nodes.
  evidence: ['spec:web/app/components/workflow/hooks/__tests__/use-selection-interactions.spec.ts']
  ours: [app/lib/src/canvas/canvas_selection.dart]
- id: canvas.drag-nodes
