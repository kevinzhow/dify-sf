- id: canvas.hooks-store
  area: canvas
  title: 'Editor plumbing: hooks store and datasets detail store providers'
  dify: [web/app/components/workflow/hooks-store, web/app/components/workflow/datasets-detail-store]
  status: partial
  reason: The datasets detail store is ported as a plain store (app/lib/src/workflow_editor/store/datasets_detail_store.dart); the React provider/context wiring has no counterpart and nothing fetches dataset details (no knowledge base service). The provider specs are still to do in the ledger.
  evidence: ['spec:web/app/components/workflow/hooks-store', 'spec:web/app/components/workflow/datasets-detail-store']
  ours: [app/lib/src/workflow_editor/store/datasets_detail_store.dart]
- id: canvas.init-graph
  area: canvas
  title: 'Loading a draft: preprocess nodes and edges (initialNodes / initialEdges)'
  dify: [web/app/components/workflow/utils/workflow-init.ts]
  status: not_applicable
  reason: dify-sf never builds a graph from Dify JSON in the client; documents come from the server's DSL import (CollabDSL) and arrive as collaboration snapshots.
  evidence: ['spec:web/app/components/workflow/utils/__tests__/workflow-init.spec.ts']
  ours: []
- id: canvas.preview
  area: canvas
  title: 'Read-only workflow preview canvas (templates, Explore, generator)'
  dify: [web/app/components/workflow/workflow-preview/index.tsx]
  status: partial
  reason: The preview's components are ported for the parts the editor reuses; the pages that show a standalone read-only preview (template details, Explore try-app, workflow generator) do not exist in dify-sf.
  evidence: ['spec:web/app/components/workflow/workflow-preview', 'spec:web/app/components/workflow/workflow-preview/components', 'spec:web/app/components/workflow/workflow-preview/components/nodes', 'spec:web/app/components/workflow/workflow-preview/components/nodes/loop']
  ours: [app/lib/src/workflow_editor/run/ui/workflow_preview.dart]
- id: canvas.goto-anything
  area: canvas
  title: 'Go to anything: command palette node search'
  dify: [web/app/components/goto-anything, web/app/components/workflow/goto-anything-search.ts, web/app/components/workflow/hooks/use-workflow-search.tsx]
  status: not_ported
  reason: outside current scope (owner to decide); dify-sf has no goto-anything palette.
  evidence: ['spec:web/app/components/workflow/hooks/__tests__/use-workflow-search.spec.tsx']
  ours: []
- id: canvas.workflow-generator
  area: canvas
  title: 'Workflow generator (generate a graph from a prompt)'
  dify: [web/app/components/workflow/workflow-generator]
  status: not_ported
  reason: "LLM invocation is available to workflow nodes, but the prompt-to-workflow generation service is not implemented."
  evidence: ['spec:web/app/components/workflow/workflow-generator']
  ours: []
- id: canvas.performance
  area: canvas
  title: 'Canvas: large graphs (2000 nodes at 120 fps, zoomed-out overview tier)'
  dify: [web/app/components/workflow/index.tsx]
  status: dify_sf_only
  reason: The native/opt-in Scene renderer has culling, overview captures and a skeleton tier; Dify renders every node as DOM. This benchmark does not describe the default Web widget canvas.
  evidence: [docs/results]
  ours: [app/lib/src/canvas/scene_renderer.dart, app/lib/src/canvas/spatial_grid.dart]

- id: canvas.mobile-web
  area: canvas
  title: 'Android Web: touch gestures and compact editor / Studio navigation'
  dify: [web/app/components/workflow/index.tsx]
  status: dify_sf_only
  reason: Android Web adds single-finger empty-canvas pan, coordinated pinch/drag/cancel, compact action rows and viewport-bounded panels/navigation; it preserves desktop preferences. Verified with Chromium touch emulation and widget keyboard/rotation tests, not a physical Android/TalkBack or every vendor browser.
  evidence: [app/test/workflow_editor/canvas_touch_test.dart, app/test/workflow_editor/mobile_layout_test.dart, docs/mobile-support.md]
  ours: [app/lib/src/canvas/canvas_touch_region.dart, app/lib/src/design/widgets/adaptive.dart, app/lib/src/workflow_editor/workflow_editor.dart]

