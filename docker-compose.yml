# Local development stack: Postgres + the collab server. Everything is bound to localhost only.
#   docker compose up --build
# With the runtime services (Dify's plugin daemon for models and tools, its Redis, the code sandbox and the SSRF proxy;
# see docs/runtime-services.md):
#   docker compose -f docker-compose.yml -f docker-compose.runtime.yml --profile runtime up --build
# With the Agent v2 agent service, its sandbox supervisor and sandbox proxy (docs/runtime-services.md, "Agent service"):
#   docker compose --profile agent up --build
services:
  postgres:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "127.0.0.1:${COLLAB_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: dify-sf-server
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLAB_HTTP_HOST: 0.0.0.0
      COLLAB_HTTP_PORT: "8080"
      # Files are disabled without a configured signing key and external URL. Never commit a key.
      COLLAB_FILES_DIRECTORY: /var/lib/collab/uploads
      COLLAB_FILES_SIGNING_KEY: ${COLLAB_FILES_SIGNING_KEY:-}
      COLLAB_FILES_URL: ${COLLAB_FILES_URL:-}
      COLLAB_FILES_INTERNAL_URL: ${COLLAB_FILES_INTERNAL_URL:-}
      COLLAB_DB_HOST: postgres
      COLLAB_DB_PORT: "5432"
      COLLAB_DB_USER: collab
      COLLAB_DB_PASSWORD: collab
      COLLAB_DB_NAME: collab
      # Protocol 1.9: encrypts model provider credentials and secret environment variables at rest. A fixed DEVELOPMENT key
      # so that local data survives restarts; any real deployment sets its own (`openssl rand -base64 32`) and keeps it:
      # without it the server refuses to store secrets, and with another key the stored ones cannot be read.
      COLLAB_SECRETS_KEY: ${COLLAB_SECRETS_KEY:-ZGlmeS1zZi1sb2NhbC1kZXZlbG9wbWVudC1rZXktMDE=}
      # Check provider credentials with one request to the provider before saving (false for servers without internet).
      COLLAB_MODELS_VALIDATE: ${COLLAB_MODELS_VALIDATE:-true}
      # The runtime services (profile `runtime`). The plugin daemon is used only when its URL is set: with the profile,
      # COLLAB_PLUGIN_DAEMON_URL=http://plugin_daemon:5002 (empty = no model runtime; see docs/runtime-services.md).
      COLLAB_PLUGIN_DAEMON_URL: ${COLLAB_PLUGIN_DAEMON_URL:-}
      COLLAB_PLUGIN_DAEMON_KEY: ${COLLAB_PLUGIN_DAEMON_KEY:-dify-sf-local-plugin-daemon-key}
      COLLAB_SANDBOX_URL: ${COLLAB_SANDBOX_URL:-}
      COLLAB_SANDBOX_KEY: ${COLLAB_SANDBOX_KEY:-dify-sf-local-sandbox-key}
      COLLAB_SSRF_PROXY_URL: ${COLLAB_SSRF_PROXY_URL:-}
      # Optional annotation-only vector service; see docker-compose.annotations.yml.
      COLLAB_ANNOTATION_WEAVIATE_URL: ${COLLAB_ANNOTATION_WEAVIATE_URL:-}
      COLLAB_ANNOTATION_WEAVIATE_KEY: ${COLLAB_ANNOTATION_WEAVIATE_KEY:-}
    volumes:
      - file_uploads:/var/lib/collab/uploads
    # Lets the server reach a service on the host (e.g. the client conformance test's stub model provider, served by
    # the test process: DIFYSF_STUB_HOST=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${COLLAB_PORT:-8080}:8080"
    networks:
      - default
      - ssrf_proxy_network   # to reach the sandbox

  # ---- profile `runtime`: Dify's peripheral services, called over HTTP (docs/runtime-services.md) ----

  # Runs model and tool plugins (one Python process per plugin). Its database `dify_plugin` lives in the Postgres above
  # (the daemon creates it on first start); installed plugins and their virtual environments live in `plugin_storage`.
  plugin_daemon:
    profiles: [runtime]
    image: langgenius/dify-plugin-daemon:0.6.10-local@sha256:34412a22d1e1d1a6c73727fef88cffbcdd9be7a21bf9ad3076b4bf5c1b88fd9b
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: collab
      DB_PASSWORD: collab
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${COLLAB_REDIS_PASSWORD:-dify-sf-local-redis}
      SERVER_PORT: "5002"
      SERVER_KEY: ${COLLAB_PLUGIN_DAEMON_KEY:-dify-sf-local-plugin-daemon-key}
      # Backwards invocation (plugin -> LLM/tool/app/file) is not implemented by dify-sf yet; LLM-only providers do not use it.
      DIFY_INNER_API_URL: http://server:8080
      DIFY_INNER_API_KEY: ${COLLAB_PLUGIN_INNER_API_KEY:-dify-sf-local-inner-api-key}
      PLUGIN_REMOTE_INSTALLING_ENABLED: "false"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      FORCE_VERIFYING_SIGNATURE: "true"
      # The first install of a plugin downloads its Python wheels (PyPI or PIP_MIRROR_URL); later starts reuse them.
      PYTHON_ENV_INIT_TIMEOUT: "600"
      PLUGIN_INSTALL_TIMEOUT: "900"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    volumes:
      - plugin_storage:/app/storage
    ports:
      - "127.0.0.1:${COLLAB_PLUGIN_DAEMON_PORT:-5002}:5002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health/check"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # Only for the plugin daemon (the server itself needs no Redis).
  redis:
    profiles: [runtime]
    image: redis:6-alpine@sha256:b362b5dff9d14d961dc3352db4776aba6a8c53ca2661d7c74ad2c121f82cdaea
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${COLLAB_REDIS_PASSWORD:-dify-sf-local-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    command: ["redis-server", "--requirepass", "${COLLAB_REDIS_PASSWORD:-dify-sf-local-redis}", "--maxmemory", "48mb", "--save", ""]

  # Python / Node.js / Jinja2 execution for code and template nodes. Only on the internal network; its egress goes
  # through ssrf_proxy.
  sandbox:
    profiles: [runtime]
    image: langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      API_KEY: ${COLLAB_SANDBOX_KEY:-dify-sf-local-sandbox-key}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: "8194"
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    volumes:
      - ./docker/sandbox/config.yaml:/conf/config.yaml:ro
      - sandbox_dependencies:/dependencies
    depends_on:
      ssrf_proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8194/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - ssrf_proxy_network

  # Forward proxy refusing private destinations (SSRF protection) for the sandbox and HTTP request nodes.
  ssrf_proxy:
    profiles: [runtime]
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    volumes:
      - ./docker/ssrf_proxy/squid.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ssrf_proxy_network
      - default

  # ---- profile `agent`: the Agent v2 agent service (docs/agent-v2.md, docs/runtime-services.md) ----

  # Runs inline agents. Reaches the server's inner endpoints on `default` and its sandboxes on agent_sandbox_network.
  agent_service:
    profiles: [agent]
    image: dify-sf-agent-service
    build:
      context: ./agent_service
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    restart: unless-stopped
    environment:
      AGENT_SERVICE_KEY: ${COLLAB_AGENT_SERVICE_KEY:-dify-sf-local-agent-service-key}
      AGENT_INNER_URL: http://server:8080
      AGENT_SANDBOX_SUPERVISOR_URL: http://sandbox_supervisor:5060
      AGENT_SANDBOX_SUPERVISOR_KEY: ${AGENT_SANDBOX_SUPERVISOR_KEY:-dify-sf-local-sandbox-supervisor-key}
    volumes:
      - agent_service_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent_service", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
      start_interval: 1s
    depends_on:
      sandbox_supervisor:
        condition: service_healthy
    networks:
      - default
      - agent_sandbox_network

  # The only component with access to the container runtime: creates one sandbox container per execution from the
  # fixed image, network and limits below, and removes it. The Docker socket is mounted here and nowhere else.
  sandbox_supervisor:
    profiles: [agent]
    image: dify-sf-agent-service
    build:
      context: ./agent_service
    entrypoint: ["/usr/local/bin/sandbox_supervisor"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    # The socket's group on the host (`stat -c %g /var/run/docker.sock`).
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      SANDBOX_SUPERVISOR_KEY: ${AGENT_SANDBOX_SUPERVISOR_KEY:-dify-sf-local-sandbox-supervisor-key}
      SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-dify-sf-agent-sandbox}
      SANDBOX_IMAGE: langgenius/dify-agent-local-sandbox:1.17.1
      SANDBOX_PROXY_URL: http://agent_sandbox_proxy:3128
      SANDBOX_LABEL: dify-sf.agent-sandbox=${COMPOSE_PROJECT_NAME:-dify-sf}
      SANDBOX_STATE_FILE: /data/sandboxes.json
      SANDBOX_MEMORY_MB: "1024"
      SANDBOX_CPUS: "1"
      SANDBOX_PIDS_LIMIT: "256"
      SANDBOX_HOME_MB: "256"
      SANDBOX_WORKSPACE_MB: "512"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_supervisor_state:/data
    healthcheck:
      # 200 only when the Docker socket answers (e.g. not with a wrong DOCKER_GID).
      test: ["CMD", "/usr/local/bin/sandbox_supervisor", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
      start_interval: 1s
    networks:
      - default

  # Squid forward proxy: the sandboxes' only way out, to the domains in docker/agent_sandbox_proxy/allowlist.txt.
  agent_sandbox_proxy:
    profiles: [agent]
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    volumes:
      - ./docker/agent_sandbox_proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/agent_sandbox_proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - agent_sandbox_network
      - default

networks:
  # The sandbox's only network: no route out except through ssrf_proxy.
  ssrf_proxy_network:
    internal: true
  # The agent sandboxes' only network (created here, never by the supervisor): no gateway, and no host address on the
  # bridge (inhibit_ipv4), so a sandbox reaches only agent_service, the proxy and other sandboxes' token-protected
  # shellctl ports.
  agent_sandbox_network:
    name: ${AGENT_SANDBOX_NETWORK:-dify-sf-agent-sandbox}
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  agent_service_data:
  sandbox_supervisor_state:
  file_uploads:
  pgdata:
  plugin_storage:
  sandbox_dependencies:
