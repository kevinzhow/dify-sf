# Local development stack: Postgres + the collab server. Everything is bound to localhost only.
#   docker compose up --build
services:
  postgres:
    image: postgres:15-alpine
    mem_limit: 1536m
    cpus: 1
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "127.0.0.1:${COLLAB_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    mem_limit: 1536m
    cpus: 2
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLAB_HTTP_HOST: 0.0.0.0
      COLLAB_HTTP_PORT: "8080"
      COLLAB_DB_HOST: postgres
      COLLAB_DB_PORT: "5432"
      COLLAB_DB_USER: collab
      COLLAB_DB_PASSWORD: collab
      COLLAB_DB_NAME: collab
      # Protocol 1.9: encrypts model provider credentials and secret environment variables at rest. A fixed DEVELOPMENT key
      # so that local data survives restarts; any real deployment sets its own (`openssl rand -base64 32`) and keeps it:
      # without it the server refuses to store secrets, and with another key the stored ones cannot be read.
      COLLAB_SECRETS_KEY: ${COLLAB_SECRETS_KEY:-ZGlmeS1zZi1sb2NhbC1kZXZlbG9wbWVudC1rZXktMDE=}
      # Check provider credentials with one request to the provider before saving (false for servers without internet).
      COLLAB_MODELS_VALIDATE: ${COLLAB_MODELS_VALIDATE:-true}
    ports:
      - "127.0.0.1:${COLLAB_PORT:-8080}:8080"

volumes:
  pgdata:
