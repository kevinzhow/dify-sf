# dify-sf live case: an iteration (terminated mode) whose inner code retries once (interval 0) and still fails for the
# item 2: the iteration and the run fail; the round after it does not start.
app:
  mode: workflow
  name: iteration_retry_terminated
  icon: 🤖
  icon_background: '#FFEAD5'
  description: ''
  use_icon_as_answer_icon: false
kind: app
version: 0.3.1
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - {id: e1, source: start, sourceHandle: source, target: code, targetHandle: target, type: custom, data: {sourceType: start, targetType: code, isInIteration: false, isInLoop: false}}
    - {id: e2, source: code, sourceHandle: source, target: iter, targetHandle: target, type: custom, data: {sourceType: code, targetType: iteration, isInIteration: false, isInLoop: false}}
    - {id: e3, source: iterstart, sourceHandle: source, target: inner, targetHandle: target, type: custom, zIndex: 1002, data: {sourceType: iteration-start, targetType: code, isInIteration: true, isInLoop: false, iteration_id: iter}}
    - {id: e4, source: iter, sourceHandle: source, target: end, targetHandle: target, type: custom, data: {sourceType: iteration, targetType: end, isInIteration: false, isInLoop: false}}
    nodes:
    - id: start
      type: custom
      position: {x: 0, y: 0}
      data: {type: start, title: Start, desc: '', variables: []}
    - id: code
      type: custom
      position: {x: 300, y: 0}
      data:
        type: code
        title: List
        desc: ''
        code_language: python3
        code: |
          def main() -> dict:
              return {"result": [1, 2, 3]}
        variables: []
        outputs:
          result: {type: 'array[number]', children: null}
    - id: iter
      type: custom
      position: {x: 600, y: 0}
      width: 400
      height: 200
      zIndex: 1
      data:
        type: iteration
        title: Each
        desc: ''
        start_node_id: iterstart
        iterator_selector: [code, result]
        output_selector: [inner, y]
        output_type: array[number]
        is_parallel: false
        parallel_nums: 10
        error_handle_mode: terminated
        flatten_output: true
        width: 400
        height: 200
    - id: iterstart
      type: custom-iteration-start
      parentId: iter
      position: {x: 24, y: 68}
      draggable: false
      selectable: false
      zIndex: 1002
      data: {type: iteration-start, title: '', desc: '', isInIteration: true}
    - id: inner
      type: custom
      parentId: iter
      position: {x: 128, y: 68}
      zIndex: 1002
      data:
        type: code
        title: Check
        desc: ''
        isInIteration: true
        isInLoop: false
        iteration_id: iter
        retry_config: {retry_enabled: true, max_retries: 1, retry_interval: 0}
        code_language: python3
        code: |
          def main(x: int) -> dict:
              if x == 2:
                  return {"y": "two"}
              return {"y": x}
        variables:
        - {variable: x, value_selector: [iter, item], value_type: number}
        outputs:
          y: {type: number, children: null}
    - id: end
      type: custom
      position: {x: 1100, y: 0}
      data:
        type: end
        title: End
        desc: ''
        outputs:
        - {variable: ys, value_selector: [iter, output], value_type: 'array[number]'}
