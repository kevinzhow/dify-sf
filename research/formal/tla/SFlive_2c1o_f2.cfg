SPECIFICATION LiveSpec
CONSTANTS
  Clients = {c1,c2}
  Nodes = {n1,n2,n3}
  InitNodes = {n1,n2}
  Fields = {f1}
  Vals = {v1,v2}
  MaxOps = 1
  MaxFaults = 2
  OpKinds = {"setField","removeNode","setRef"}
  NoRef = NoRef
  Broken = Broken
  NoStale = FALSE
  NoCascade = FALSE
  NoDedup = FALSE
  EarlyAck = FALSE
  NoFrom = FALSE
  NoResend = FALSE
  EqualStamp = FALSE
  NoTouch = FALSE
CONSTANT Region <- RegionAll
INVARIANTS Inv_P1 Inv_P2 Inv_P4 Inv_Acked Inv_Truth Inv_Log
PROPERTY Conv
CHECK_DEADLOCK TRUE
